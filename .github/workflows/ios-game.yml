name: MASAR game → TestFlight

# Compiles, signs and uploads the MASAR game to TestFlight on a macOS runner.
#
# Input: the Unity-exported Xcode project, produced on Windows by tools/build-ios.ps1,
#        zipped, AES-256 encrypted, and uploaded as the asset of the "xcode-latest"
#        pre-release. It is encrypted because the repository is public and the export
#        contains Unity engine libraries that must not be redistributed.
#
# Required repository secrets (BUILD_INSTRUCTIONS.md §4):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, APPLE_TEAM_ID, XCODE_ZIP_PASSPHRASE

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to TestFlight (false = compile and sign only)"
        type: boolean
        default: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4   # for tools/ci scripts

      - name: Check secrets are configured
        env:
          HAS_P8: ${{ secrets.ASC_KEY_P8 != '' }}
          HAS_PASS: ${{ secrets.XCODE_ZIP_PASSPHRASE != '' }}
        run: |
          missing=0
          for v in ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret $v"; missing=1; fi
          done
          [ "$HAS_P8" = "true" ] || { echo "::error::Missing secret ASC_KEY_P8"; missing=1; }
          [ "$HAS_PASS" = "true" ] || { echo "::error::Missing secret XCODE_ZIP_PASSPHRASE"; missing=1; }
          exit $missing

      - name: Disk space before
        run: df -h /

      - name: Select newest installed Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Download and decrypt the Xcode project
        env:
          XCODE_ZIP_PASSPHRASE: ${{ secrets.XCODE_ZIP_PASSPHRASE }}
        run: |
          gh release download xcode-latest --repo "$GITHUB_REPOSITORY" --pattern "masar-ios-xcode.zip.enc" --dir "$RUNNER_TEMP"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:XCODE_ZIP_PASSPHRASE \
            -in "$RUNNER_TEMP/masar-ios-xcode.zip.enc" -out "$RUNNER_TEMP/xcode.zip"
          rm "$RUNNER_TEMP/masar-ios-xcode.zip.enc"
          mkdir -p "$RUNNER_TEMP/xcode"
          # unzip exits 1 for warnings only (e.g. an old archive with backslash paths)
          unzip -q "$RUNNER_TEMP/xcode.zip" -d "$RUNNER_TEMP/xcode" || [ $? -eq 1 ]
          rm "$RUNNER_TEMP/xcode.zip"
          # Zips made on Windows carry no Unix permissions: make every directory traversable
          chmod -R u+rwX "$RUNNER_TEMP/xcode"
          ls "$RUNNER_TEMP/xcode"
          cat "$RUNNER_TEMP/xcode/MASAR_BUILD_INFO.txt" || true
          BN=$(grep '^build=' "$RUNNER_TEMP/xcode/MASAR_BUILD_INFO.txt" | cut -d= -f2 | tr -d '\r')
          echo "BUILD_NUMBER=${BN}" >> "$GITHUB_ENV"

      - name: Install API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyjwt cryptography

      # Each run's keychain is empty, so Xcode creates new signing certificates every time and
      # Apple caps how many a team may have. Revoke what past MASAR runs left behind (only
      # certificates issued during one of this workflow's runs and made with an API key), then
      # note what exists now so the last step can revoke exactly what this run creates.
      - name: Signing certificates - clear old MASAR CI ones
        continue-on-error: true
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow ios-game.yml --limit 500             --json databaseId,createdAt,updatedAt             --jq '[.[] | {id: .databaseId, start: .createdAt, end: .updatedAt}]' > "$RUNNER_TEMP/windows.json"
          "$RUNNER_TEMP/venv/bin/python" tools/ci/asc_certs.py old "$RUNNER_TEMP/windows.json" --revoke
          "$RUNNER_TEMP/venv/bin/python" tools/ci/asc_certs.py snapshot "$RUNNER_TEMP/certs-before.json"

      - name: Archive (automatic signing via API key)
        working-directory: ${{ runner.temp }}/xcode
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MASAR.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|warning: .*deprecated|ARCHIVE (SUCCEEDED|FAILED)" || true
          test -d "$RUNNER_TEMP/MASAR.xcarchive"

      - name: Export and upload to TestFlight
        if: ${{ inputs.upload }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>testFlightInternalTestingOnly</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/MASAR.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/export.log" | grep -Ei "error|upload|EXPORT" || true
          grep -q "EXPORT SUCCEEDED" "$RUNNER_TEMP/export.log" || grep -qi "Upload succeeded" "$RUNNER_TEMP/export.log"

      - name: TestFlight - wait for processing and invite the tester
        if: ${{ inputs.upload }}
        env:
          TESTER_EMAIL: ${{ secrets.TESTER_EMAIL }}
          BUNDLE_ID: app.masar.game
        run: |
          "$RUNNER_TEMP/venv/bin/python" "$GITHUB_WORKSPACE/tools/ci/testflight_invite.py"

      - name: Disk space after
        if: always()
        run: df -h /

      # The certificates this run created live only in this runner's keychain, which is
      # deleted with the runner. Builds already uploaded to TestFlight are not affected.
      - name: Signing certificates - revoke this run's
        if: always()
        continue-on-error: true
        run: |
          [ -f "$RUNNER_TEMP/certs-before.json" ] || { echo "No snapshot, nothing to do."; exit 0; }
          "$RUNNER_TEMP/venv/bin/python" tools/ci/asc_certs.py own "$RUNNER_TEMP/certs-before.json" --revoke

      - name: Remove API key and decrypted project
        if: always()
        run: |
          chmod -R u+rwX "$RUNNER_TEMP/xcode" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/keys" "$RUNNER_TEMP/xcode"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-game-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
          retention-days: 7
