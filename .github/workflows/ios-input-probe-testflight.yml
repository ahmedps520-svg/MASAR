name: iOS Input Probe → TestFlight

# Signs the probe with an App Store Connect API key and uploads it to TestFlight.
# Run manually from the Actions tab (or `gh workflow run "iOS Input Probe → TestFlight"`).
#
# Required repository secrets (see BUILD_INSTRUCTIONS.md §4):
#   ASC_KEY_ID      App Store Connect API key ID (Team key, Admin role)
#   ASC_ISSUER_ID   Issuer ID shown on the API keys page
#   ASC_KEY_P8      Full text of the AuthKey_XXXXXX.p8 file
#   APPLE_TEAM_ID   10-character Apple Developer Team ID
#
# The app record for the bundle ID must already exist in App Store Connect.

on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tools/probes/ios-input-probe
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check secrets are configured
        working-directory: .
        env:
          HAS_P8: ${{ secrets.ASC_KEY_P8 != '' }}
        run: |
          missing=0
          for v in ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret $v"; missing=1; fi
          done
          if [ "$HAS_P8" != "true" ]; then echo "::error::Missing secret ASC_KEY_P8"; missing=1; fi
          exit $missing

      - uses: actions/checkout@v4

      - name: Select newest installed Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive (automatic signing via API key)
        run: |
          xcodebuild archive \
            -project MasarInputProbe.xcodeproj \
            -scheme MasarInputProbe \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MasarInputProbe.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tee archive.log | grep -E "error:|BUILD|ARCHIVE" || true
          test -d "$RUNNER_TEMP/MasarInputProbe.xcarchive"

      - name: Export and upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>testFlightInternalTestingOnly</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/MasarInputProbe.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tee export.log | grep -Ei "error|upload|EXPORT" || true
          grep -q "EXPORT SUCCEEDED" export.log || grep -qi "Upload succeeded" export.log

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testflight-logs
          path: |
            tools/probes/ios-input-probe/archive.log
            tools/probes/ios-input-probe/export.log
          retention-days: 7
