name: TestFlight - invite tester only

# Re-runs only the last step of "MASAR game → TestFlight": export compliance, the internal
# group and the tester, for builds that are already uploaded. No compile, no upload.

on:
  workflow_dispatch:

jobs:
  invite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"
      - name: Invite
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TESTER_EMAIL: ${{ secrets.TESTER_EMAIL }}
          BUNDLE_ID: app.masar.game
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          source "$RUNNER_TEMP/venv/bin/activate"
          pip install --quiet pyjwt cryptography
          python tools/ci/testflight_invite.py
      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
